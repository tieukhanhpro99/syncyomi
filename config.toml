# config.toml for Render deployment

# Hostname / IP - Render requires 0.0.0.0
#
# Default: "0.0.0.0"
#
host = "0.0.0.0"

# Port - Render will set PORT env var
#
# Default: 10000
#
port = 10000

# Database Type
# Set database type to use. Supported: sqlite, postgres
# For Render, we use SQLite for simplicity
#
DatabaseType = "sqlite"

# Postgres Host (only needed if using postgres)
# Set postgres host to use.
# This will be overridden by environment variables on Render
#
#PostgresHost = "localhost"

# Postgres Port (only needed if using postgres)
# Set postgres port to use.
# This will be overridden by environment variables on Render
#
#PostgresPort = 5432

# Postgres Database (only needed if using postgres)
# Set postgres database to use.
# This will be overridden by environment variables on Render
#
#PostgresDatabase = "syncyomi"

# Postgres User (only needed if using postgres)
# Set postgres user to use.
# This will be overridden by environment variables on Render
#
#PostgresUser = "syncyomi"

# Postgres Pass (only needed if using postgres)
# Set postgres password to use.
# This will be overridden by environment variables on Render
#
#PostgresPass = "syncyomi"

# Postgres SSL Mode (only needed if using postgres)
# Set which SSL mode to communicate with Postgres. 
# Options: disable, allow, prefer, require, verify-ca, verify-full
# For Render, disable is fine
#PostgresSslMode = "disable"

# Base url
# Set custom baseUrl eg /tachiyomi/ to serve in subdirectory.
# Not needed for subdomain, or by accessing with the :port directly.
#
# Optional
#
#baseUrl = "/SyncYomi/"

# tachiyomi-sync-server logs file
# If not defined, logs to stdout make sure it's forward slash otherwise it won't work
#
# Optional
#
#logPath = "log/SyncYomi.log"

# Log level
#
# Default: "INFO" (changed from DEBUG for production)
#
# Options: "ERROR", "DEBUG", "INFO", "WARN", "TRACE"
#
logLevel = "INFO"

# Log Max Size
#
# Default: 50
#
# Max log size in megabytes
#
#logMaxSize = 50

# Log Max Backups
#
# Default: 3
#
# Max amount of old log files
#
#logMaxBackups = 3

# Check for updates
# Disabled for Render deployment
#
checkForUpdates = false

# Session secret
#
sessionSecret = "37335a8067c2fb35a3cbe13386a62243"
